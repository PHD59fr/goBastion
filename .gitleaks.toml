title = "goBastion public test fixtures"
minVersion = "v8.30.1"

[extend]
useDefault = true

# Preserve the built-in detector and add exact-value exceptions only within
# individually reviewed test files. See docs/security/SCANNER_TRIAGE.md.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public deterministic AES test fixture; never a deployment key"
condition = "AND"
regexTarget = "secret"
regexes = ['''^PvHlWvN638cmg6oz6ixYa/gsYFNBqD6K1d87\+A\+8DMo=$''']
paths = [
  '''(^|/)cmd/secret-migrate/main_test\.go$''',
  '''(^|/)internal/commands/ssh/encryption_test\.go$''',
  '''(^|/)internal/db/export_test\.go$''',
  '''(^|/)internal/mfa/encryption_test\.go$''',
  '''(^|/)internal/session/encryption_test\.go$''',
  '''(^|/)internal/utils/sftpProxy/encryption_test\.go$''',
  '''(^|/)internal/utils/dbConnector/encryption_test\.go$''',
  '''(^|/)internal/utils/totp/encryption_test\.go$''',
  '''(^|/)internal/secretstore/store_test\.go$''',
  '''(^|/)internal/utils/sshHostKey/sshHostKey_test\.go$''',
  '''(^|/)internal/utils/cryptokey/cryptokey_test\.go$''',
  '''(^|/)scripts/test-secret-postgres\.sh$''',
]

[[rules.allowlists]]
description = "Public repeated hexadecimal export fixture in three reviewed tests"
condition = "AND"
regexTarget = "secret"
regexes = ['''^0123456789abcdef0123456789abcdef$''']
paths = [
  '''(^|/)internal/db/backend_integration_test\.go$''',
  '''(^|/)internal/db/export_test\.go$''',
  '''(^|/)internal/db/secret_import_test\.go$''',
]

[[rules.allowlists]]
description = "Public wrong-export-key fixture used to verify rejection"
condition = "AND"
regexTarget = "secret"
regexes = ['''^fedcba9876543210fedcba9876543210$''']
paths = ['''(^|/)internal/db/secret_import_test\.go$''']

[[rules.allowlists]]
description = "Public RFC 6238 TOTP seed used only in the re-enrollment test"
condition = "AND"
regexTarget = "secret"
regexes = ['''^GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ$''']
paths = ['''(^|/)internal/mfa/profile_test\.go$''']

[[rules.allowlists]]
description = "Literal flag in the audit redaction regression; not an API credential"
condition = "AND"
regexTarget = "secret"
regexes = ['''^--API_KEY=secret$''']
paths = ['''(^|/)internal/session/audit_logging_test\.go$''']
