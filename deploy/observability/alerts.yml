groups:
  - name: gobastion-signals
    interval: 30s
    rules:
      - alert: GoBastionMetricsScrapeFailed
        expr: up{job="gobastion"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: goBastion metrics endpoint is not scrapeable
          description: Check process state, loopback network namespace, bearer credential file, and exporter readiness. This does not measure SSH session establishment availability.

      - alert: GoBastionRegisteredSessionsPresent
        expr: gobastion_sessions_active > 0
        for: 10m
        labels:
          severity: info
        annotations:
          summary: goBastion reports registered active sessions
          description: This is a per-instance point-in-time registry count; stale rows can remain until cleanup. It is not a cluster-wide admission or drain signal.

      - alert: GoBastionAccessDenialsObserved
        expr: increase(gobastion_access_denied_total[10m]) > 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: goBastion recorded access denials
          description: Review correlated audit events through the approved security workflow; the metric does not identify a user or establish malicious activity.

      - alert: GoBastionMFAFailuresObserved
        expr: increase(gobastion_mfa_failures_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: goBastion recorded MFA failures
          description: Review correlated audit events without exposing MFA secrets or backup codes.

      - alert: GoBastionSyncFailuresObserved
        expr: increase(gobastion_sync_failures_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: goBastion local OS synchronization failed
          description: Check the instance logs and local host reconciliation. A failure on one instance does not describe other instances.

      - alert: GoBastionDatabaseConnectionErrorsObserved
        expr: increase(gobastion_db_connection_errors_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: goBastion observed database connection errors
          description: Check database reachability and instance logs. Error counters are diagnostic signals, not an availability SLO.

      - alert: GoBastionRecordingArchiveFailuresObserved
        expr: increase(gobastion_recording_archival_failures_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: goBastion recording archival failures were observed
          description: Check archive storage and recovery logs. Review recording retention and access controls before remediation.

      - alert: GoBastionPendingRecordingAgeHigh
        expr: gobastion_recording_oldest_pending_age_seconds > 3600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: goBastion has old pending recording files
          description: The one-hour threshold is an example requiring local retention and workload review. Pending-file metrics are exposed only when an archive tree is configured.
