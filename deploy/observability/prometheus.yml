global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gobastion
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 5s
    authorization:
      type: Bearer
      credentials_file: /run/secrets/gobastion-observability-token
    static_configs:
      # Prometheus must share the host network namespace (or a pod network
      # namespace) with goBastion because OBS_LISTEN_ADDR is loopback-only.
      - targets: [127.0.0.1:9090]
        labels:
          service: gobastion
